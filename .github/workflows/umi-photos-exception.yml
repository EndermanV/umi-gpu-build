name: umi Photos exception diagnostic (iPadOS 17 / arm64)

# Builds the owner-signed Adreno Metal plugin, the Turnip library and the GPU addon with the official UniXNU scripts, on a macOS
# runner (they need `xcrun --sdk iphoneos`, meson, glslang and cargo; none of that exists on Linux). Nothing in this workflow
# reads a secret, an IPSW, a Data seed or any Apple trust file: the artifacts are the ad-hoc signed plugin bundle, the probe
# daemon and plist, trust.json (the CDHashes) and the addon file. The owner trust bundle is made locally afterwards with
# scripts/make-owner-trust-bundle.py from trust.json and the local original trust bundle.
#
# Run it in a private repository, once with stage=toolchain (reports tools and SDK, builds nothing), then stage=build.
# Delete the run after downloading the artifacts.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "toolchain: report tools only; build: full build"
        type: choice
        options: ["toolchain", "build"]
        default: "toolchain"
      unixnu_ref:
        description: "UniXNU commit (the umi build pin)"
        required: true
        default: "c740efb5b23e94453bb179f7801eb592baafacf6"
      xcode:
        description: "Xcode version of the macos-26 image (/Applications/Xcode_<version>.app)"
        required: true
        default: "26.6"

permissions:
  contents: read

concurrency:
  group: umi-gpu-userspace
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 240
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ inputs.xcode }}.app/Contents/Developer
    steps:
      - name: Check out UniXNU at the pin
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: ${{ inputs.unixnu_ref }}
          persist-credentials: false

      - name: Check out the three submodules the GPU build uses
        run: |
          # drivers/Adreno740 (the kernel/user ABI header Turnip is built against), drivers/AdrenoMetal (the plugin source),
          # drivers/GopFramebuffer (the plugin includes ../GopFramebuffer/NativeGOPWire.h) and kits/AdrenoPM4 are submodules of UniXNU; the others are not needed here and are not fetched.
          git submodule update --init --depth 1 drivers/Adreno740 drivers/AdrenoMetal drivers/GopFramebuffer kits/AdrenoPM4
          git submodule status drivers/Adreno740 drivers/AdrenoMetal drivers/GopFramebuffer kits/AdrenoPM4
          test -f drivers/GopFramebuffer/NativeGOPWire.h
          test -f drivers/Adreno740/NativeAdrenoABI.h
          test -f drivers/AdrenoMetal/NativeAdrenoMetalPlugin.mm
          test -f kits/AdrenoPM4/AdrenoPM4.c

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install host tools
        run: |
          brew install glslang shaderc spirv-tools bison llvm lld pkgconf rustup
          {
            echo "/opt/homebrew/opt/bison/bin"
            echo "/opt/homebrew/opt/llvm/bin"
            echo "$HOME/.cargo/bin"
          } >> "$GITHUB_PATH"
          # The image already has rustup (the log said so); there is no rustup-init to call. Find the binary instead of assuming a path.
          RUSTUP=$(command -v rustup || true)
          [ -n "$RUSTUP" ] || RUSTUP="$(brew --prefix rustup)/bin/rustup"
          [ -x "$RUSTUP" ] || { echo "no rustup binary found"; ls -l "$(brew --prefix rustup)/bin" || true; exit 1; }
          echo "rustup: $RUSTUP"
          "$RUSTUP" toolchain install 1.98.0 --profile minimal
          "$RUSTUP" target add aarch64-apple-ios --toolchain 1.98.0
          # `cargo +1.98.0` needs rustup's cargo proxy on PATH ahead of any other cargo.
          dirname "$RUSTUP" >> "$GITHUB_PATH"

      - name: Report the toolchain
        run: |
          set -x
          sw_vers; uname -m
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path
          bison --version | head -n 1
          glslangValidator --version | head -n 2
          cargo +1.98.0 --version
          rustup +1.98.0 target list --installed
          python3 --version
          df -h "$GITHUB_WORKSPACE"
          missing=0
          for tool in git make clang cmake ninja bison glslangValidator glslc cargo codesign; do
            command -v "$tool" >/dev/null || { echo "MISSING $tool"; missing=1; }
          done
          exit "$missing"

      - name: Fetch the pinned sources and set up Python
        if: inputs.stage == 'build'
        run: |
          # The same preparation as build_plugin() in scripts/build-boot-runtime.py: the pinned Mesa and translator checkouts,
          # the recorded Mesa patches, the Python venv. The module name has a hyphen, so it is loaded by path.
          python3 - <<'PY'
          import importlib.util, json, subprocess, sys
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('boot_runtime', 'scripts/build-boot-runtime.py')
          m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          root = m.ROOT
          pins = json.loads((root / 'scripts/data/adreno-compiler-inputs.json').read_text())
          mesa = root / '.cache/mesa-work'
          # turnip-frame-diagnostics.patch creates a file with `--- /dev/null` but no `new file mode` line, which git (2.43 and
          # the runner's 2.56 alike) refuses with "dev/null: No such file or directory". The upstream patch is identical in
          # UniXNU main, so the line is added here, in this runner's checkout only; the patch files are not hashed anywhere
          # (the Turnip build hashes the patched Mesa tree), and the same fixed file serves the reverse check of
          # validate_recorded_patches.
          import re
          for patch in pins['patches']:
              path = root / patch
              text = path.read_text()
              fixed = re.sub(r'^(diff --git a/(\S+) b/\2)\n(--- /dev/null)$', r'\1\nnew file mode 100644\n\3', text, flags=re.M)
              if fixed != text:
                  print('added new file mode to', patch)
                  path.write_text(fixed)
          if m.checkout(mesa, pins['mesa']):
              for patch in pins['patches']:
                  m.run('git', '-C', mesa, 'apply', root / patch)
          m.validate_recorded_patches(root, mesa, pins)
          translator = json.loads((root / 'scripts/data/gpu-metal-vulkan-inputs.json').read_text())['translator']
          m.checkout(root / '.cache/gpu-reference/metal2vulkan', translator)
          venv = root / '.cache/mesa-venv'
          if not (venv / 'bin/python').is_file():
              m.run(sys.executable, '-m', 'venv', venv)
          m.run(venv / 'bin/python', '-m', 'pip', 'install', '-r', root / 'scripts/requirements-adreno-compiler.txt')
          PY

      - name: Build Turnip (ios)
        if: inputs.stage == 'build'
        run: python3 scripts/build-turnip-darwin.py --target ios

      - name: Allow the two functions the arm64 build leaves unused
        if: inputs.stage == 'build'
        run: |
          # NativeAdrenoMetalPlugin.mm calls writeTask and patchFramebufferBranch only inside `#if defined(__arm64e__)` (the iPadOS 27
          # render server). The iOS 17 target is plain arm64, so under -Werror they are "unused function" errors. Only that one
          # warning is relaxed, in this runner's copy of the script; the source and every other warning are unchanged.
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/build-adreno-metal-plugin.py')
          text = path.read_text()
          old = "'-Wextra', '-Werror',"
          assert text.count(old) == 1, text.count(old)
          path.write_text(text.replace(old, "'-Wextra', '-Werror', '-Wno-unused-function',"))
          print('added -Wno-unused-function')
          PY

      - name: Forward existing Photos exception diagnostic to stderr
        if: inputs.stage == 'build'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,base64
          assert hashlib.sha256(Path('drivers/AdrenoMetal/NativeAdrenoMetalPlugin.mm').read_bytes()).hexdigest()=='8d294f73246d2f9748145c7e4cdb878a43e0bd157cbc67ca07011e65a174a7de'
          assert hashlib.sha256(Path('drivers/AdrenoMetal/ExceptionDiag.h').read_bytes()).hexdigest()=='86bc694b8b93dd450cbf081c6d44f01742565d2132a020846f41ed2a072e118e'
          Path('drivers/AdrenoMetal/NativeAdrenoMetalPlugin.mm').write_bytes(base64.b64decode(''))
          Path('drivers/AdrenoMetal/ExceptionDiag.h').write_bytes(base64.b64decode(''))
          Path('drivers/AdrenoMetal/UmiMetalTelemetry.h').write_bytes(base64.b64decode(''))
          PY

      - name: Build the Metal plugin and probe daemon (ios)
        if: inputs.stage == 'build'
        run: python3 scripts/build-adreno-metal-plugin.py --target ios --no-replay

      - name: Pack the GPU addon
        if: inputs.stage == 'build'
        run: |
          # With the probe daemon: the owner trust module needs its CDHash too (make-owner-trust-bundle.py).
          python3 scripts/make-gpu-addon.py --publish build/gpuaddon.bin
          ls -l build/gpuaddon.bin build/adreno-metal-plugin
          cat build/adreno-metal-plugin/trust.json
          shasum -a 256 build/gpuaddon.bin

      - name: Artifacts
        if: inputs.stage == 'build'
        uses: actions/upload-artifact@v4
        with:
          name: umi-photos-exception-ios17
          retention-days: 1
          if-no-files-found: error
          path: |
            drivers/AdrenoMetal/ExceptionDiag.h
            drivers/AdrenoMetal/UmiMetalTelemetry.h
            drivers/AdrenoMetal/NativeAdrenoMetalPlugin.mm
            build/gpuaddon.bin
            build/adreno-metal-plugin/trust.json
            build/adreno-metal-plugin/NativeAdrenoMetal.bundle
            build/adreno-metal-plugin/*.plist
            build/adreno-metal-plugin/adrenoprobed
            build/mesa-tu-ios/**/*.dylib
